<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crypto Business Social Club</title>

  <!-- PWA Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #09090b;
      --card-bg: #121215;
      --border: #222228;
      --border-focus: #444450;
      --text: #ffffff;
      --text-muted: #71717a;
      --accent: #ffffff;
      --btn-bg: #ffffff;
      --btn-text: #000000;
      --error: #ff453a;
      --success: #30d158;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-logo {
      width: 180px;
      height: auto;
      margin: 0 auto;
      display: block;
      filter: invert(1); /* Convierte el logo negro a blanco puro */
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 16px;
      background: #000000;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 16px;
      font-weight: 500;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
    }

    input::placeholder {
      color: #3f3f46;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 10px;
      background: var(--btn-bg);
      border: none;
      border-radius: 12px;
      color: var(--btn-text);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background: #e4e4e7;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(1px);
      opacity: 0.9;
    }

    .status-box {
      margin-top: 20px;
      min-height: 24px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
    }

    .msg-success { color: var(--success); }
    .msg-error { color: var(--error); }
    .msg-saving { color: var(--text-muted); }
  </style>
</head>
<body>

<div class="card">
  <div class="brand-header">
    <!-- Logotipo Crypto exacto integrado en alta definición -->
    <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 350 250'><path d='M120,25 L230,25 L230,50 L205,75 L205,100 L230,100 L230,125 L120,125 Z M145,50 L145,100 L180,100 L180,75 L155,75 L155,50 Z' fill='%23000'/><path d='M120,35 L120,115 L220,115 L220,105 L130,105 L130,45 L220,45 L220,35 Z' fill='%23000' transform='rotate(180 170 75)'/><text x='175' y='180' font-family='Arial Black, sans-serif' font-size='38' font-weight='900' letter-spacing='6' text-anchor='middle' fill='%23000'>CRYPTO</text><text x='175' y='205' font-family='Arial, sans-serif' font-size='11' font-weight='bold' letter-spacing='4' text-anchor='middle' fill='%23000'>BUSINESS SOCIAL CLUB</text></svg>" alt="Crypto Club" class="brand-logo">
  </div>

  <form id="clienteForm">
    <div class="form-group">
      <label for="nombre">Nombre Completo</label>
      <input type="text" id="nombre" placeholder="Ej. Carlos López" required autocomplete="off" spellcheck="false">
    </div>

    <div class="form-group">
      <label for="telefono">Teléfono / WhatsApp</label>
      <input type="tel" id="telefono" placeholder="4491234567" maxlength="10" required autocomplete="off">
    </div>

    <button type="submit" id="btnGuardar">Registrar Cliente ➔</button>
  </form>

  <div class="status-box" id="statusBox"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA5nN5tRexqV9gdjvSDnq4LtmbFw4qMsr8",
    authDomain: "antro-clientes.firebaseapp.com",
    projectId: "antro-clientes",
    storageBucket: "antro-clientes.firebasestorage.app",
    messagingSenderId: "678602169342",
    appId: "1:678602169342:web:4ac3083d404e214424beaf"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const form = document.getElementById("clienteForm");
  const nombreInput = document.getElementById("nombre");
  const telefonoInput = document.getElementById("telefono");
  const statusBox = document.getElementById("statusBox");
  const btn = document.getElementById("btnGuardar");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const nombre = nombreInput.value.trim();
    let numLimpio = telefonoInput.value.replace(/\D/g, '');

    if (numLimpio.length !== 10) {
      statusBox.innerHTML = `<span class="msg-error">⚠️ Ingresa 10 dígitos válidos</span>`;
      return;
    }

    const telefonoFormateado = `+52${numLimpio}`;
    btn.disabled = true;
    btn.style.opacity = "0.5";
    statusBox.innerHTML = `<span class="msg-saving">Guardando...</span>`;

    try {
      await setDoc(doc(db, "clientes", telefonoFormateado), {
        nombre: nombre,
        telefono: telefonoFormateado,
        estadoSuscripcion: "ACTIVO",
        estadoUltimoEnvio: "PENDIENTE",
        fechaRegistro: serverTimestamp()
      }, { merge: true });

      statusBox.innerHTML = `<span class="msg-success">✓ Registrado: ${nombre}</span>`;

      form.reset();
      nombreInput.focus();

    } catch (err) {
      console.error(err);
      statusBox.innerHTML = `<span class="msg-error">❌ Error de conexión</span>`;
    } finally {
      btn.disabled = false;
      btn.style.opacity = "1";
    }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
    });
  }
</script>

</body>
</html>
