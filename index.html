<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crypto Business Social Club</title>

  <!-- PWA & Theme Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Crypto Club">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #050505;
      --card-bg: rgba(18, 18, 20, 0.75);
      --gold-primary: #d4af37;
      --gold-gradient: linear-gradient(135deg, #f3e5ab 0%, #c5a059 50%, #9a7b38 100%);
      --text-main: #ffffff;
      --text-sub: #8e8e93;
      --border-color: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(255, 255, 255, 0.04);
      --success: #2e7d32;
      --error: #d32f2f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(197, 160, 89, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 50% 85%, rgba(255, 255, 255, 0.02) 0%, transparent 50%);
    }

    .card {
      width: 100%;
      max-width: 410px;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 36px 28px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 1px rgba(255,255,255,0.1);
      position: relative;
    }

    .brand-section {
      text-align: center;
      margin-bottom: 32px;
    }

    /* Logo Vectorial SVG */
    .brand-logo-svg {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px auto;
      display: block;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 4px;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .brand-subtitle {
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--text-sub);
      text-transform: uppercase;
      margin-top: 4px;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 16px 18px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      color: var(--text-main);
      font-size: 16px;
      font-weight: 500;
      outline: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    input:focus {
      border-color: rgba(197, 160, 89, 0.5);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 20px rgba(197, 160, 89, 0.12);
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }

    button {
      width: 100%;
      padding: 18px;
      margin-top: 10px;
      background: var(--gold-gradient);
      border: none;
      border-radius: 14px;
      color: #0d0d0d;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(197, 160, 89, 0.25);
      transition: all 0.25s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(197, 160, 89, 0.35);
    }

    button:active {
      transform: translateY(1px);
      opacity: 0.9;
    }

    .status-container {
      margin-top: 24px;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-tag {
      padding: 10px 18px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      animation: fadeIn 0.3s ease;
    }

    .status-tag.success {
      background: rgba(46, 125, 50, 0.15);
      border: 1px solid rgba(76, 175, 80, 0.3);
      color: #81c784;
    }

    .status-tag.error {
      background: rgba(211, 47, 47, 0.15);
      border: 1px solid rgba(239, 83, 80, 0.3);
      color: #e57373;
    }

    .status-tag.saving {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--gold-primary);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="brand-section">
    <!-- Logotipo Crypto limpiamente dibujado en SVG -->
    <svg class="brand-logo-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M100 20L180 66.2V133.8L100 180L20 133.8V66.2L100 20ZM38 76.5V123.5L100 159.3L162 123.5V76.5L100 40.7L38 76.5Z" fill="url(#goldGrad)"/>
      <path d="M60 85H140V102H60V85Z" fill="url(#goldGrad)"/>
      <path d="M60 115H115V132H60V115Z" fill="url(#goldGrad)"/>
      <defs>
        <linearGradient id="goldGrad" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
          <stop stop-color="#F3E5AB"/>
          <stop offset="0.5" stop-color="#C5A059"/>
          <stop offset="1" stop-color="#9A7B38"/>
        </linearGradient>
      </defs>
    </svg>
    <h1 class="brand-title">Crypto</h1>
    <div class="brand-subtitle">Business Social Club</div>
  </div>

  <form id="clienteForm">
    <div class="form-group">
      <label for="nombre">Nombre Completo</label>
      <input type="text" id="nombre" placeholder="Ej. Carlos López" required autocomplete="off" spellcheck="false">
    </div>

    <div class="form-group">
      <label for="telefono">Teléfono / WhatsApp</label>
      <input type="tel" id="telefono" placeholder="4491234567" maxlength="10" required autocomplete="off">
    </div>

    <button type="submit" id="btnGuardar">Registrar Accesos ➔</button>
  </form>

  <div class="status-container" id="statusContainer"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA5nN5tRexqV9gdjvSDnq4LtmbFw4qMsr8",
    authDomain: "antro-clientes.firebaseapp.com",
    projectId: "antro-clientes",
    storageBucket: "antro-clientes.firebasestorage.app",
    messagingSenderId: "678602169342",
    appId: "1:678602169342:web:4ac3083d404e214424beaf"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const form = document.getElementById("clienteForm");
  const nombreInput = document.getElementById("nombre");
  const telefonoInput = document.getElementById("telefono");
  const statusContainer = document.getElementById("statusContainer");
  const btn = document.getElementById("btnGuardar");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const nombre = nombreInput.value.trim();
    let numLimpio = telefonoInput.value.replace(/\D/g, '');

    if (numLimpio.length !== 10) {
      statusContainer.innerHTML = `<div class="status-tag error">⚠️ Ingresa 10 dígitos válidos</div>`;
      return;
    }

    const telefonoFormateado = `+52${numLimpio}`;
    btn.disabled = true;
    btn.style.opacity = "0.6";
    statusContainer.innerHTML = `<div class="status-tag saving">⏳ Registrando...</div>`;

    try {
      await setDoc(doc(db, "clientes", telefonoFormateado), {
        nombre: nombre,
        telefono: telefonoFormateado,
        estadoSuscripcion: "ACTIVO",
        estadoUltimoEnvio: "PENDIENTE",
        fechaRegistro: serverTimestamp()
      }, { merge: true });

      statusContainer.innerHTML = `<div class="status-tag success">✓ Registrado: ${nombre}</div>`;

      form.reset();
      nombreInput.focus();

    } catch (err) {
      console.error(err);
      statusContainer.innerHTML = `<div class="status-tag error">❌ Error al guardar</div>`;
    } finally {
      btn.disabled = false;
      btn.style.opacity = "1";
    }
  });

  // Registro de Service Worker para PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
    });
  }
</script>

</body>
</html>
