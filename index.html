<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VIP Access</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, sans-serif;
    }

    body {
      background: #050505;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: #111111;
      border: 1px solid #222222;
      border-radius: 16px;
      padding: 32px 24px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .header p {
      font-size: 11px;
      color: #666666;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888888;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 14px;
      background: #000000;
      border: 1px solid #262626;
      border-radius: 8px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #ffffff;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 8px;
      background: #ffffff;
      border: none;
      border-radius: 8px;
      color: #000000;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }

    button:active {
      opacity: 0.8;
    }

    .status {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
    }

    .ok { color: #30d158; }
    .err { color: #ff453a; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>REGISTRO VIP</h1>
    <p>A c c e s o s</p>
  </div>

  <form id="clienteForm">
    <div class="form-group">
      <label for="nombre">Nombre Completo</label>
      <input type="text" id="nombre" placeholder="Nombre y Apellido" required autocomplete="off">
    </div>

    <div class="form-group">
      <label for="telefono">Teléfono</label>
      <input type="tel" id="telefono" placeholder="10 dígitos" maxlength="10" required autocomplete="off">
    </div>

    <button type="submit" id="btnGuardar">Guardar Registro ➔</button>
  </form>

  <div class="status" id="status"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA5nN5tRexqV9gdjvSDnq4LtmbFw4qMsr8",
    authDomain: "antro-clientes.firebaseapp.com",
    projectId: "antro-clientes",
    storageBucket: "antro-clientes.firebasestorage.app",
    messagingSenderId: "678602169342",
    appId: "1:678602169342:web:4ac3083d404e214424beaf"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const form = document.getElementById("clienteForm");
  const status = document.getElementById("status");
  const btn = document.getElementById("btnGuardar");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const nombre = document.getElementById("nombre").value.trim();
    let num = document.getElementById("telefono").value.replace(/\D/g, '');

    if (num.length !== 10) {
      status.innerHTML = `<span class="err">Teléfono debe tener 10 dígitos</span>`;
      return;
    }

    const tel = `+52${num}`;
    btn.disabled = true;
    status.innerHTML = `Guardando...`;

    try {
      await setDoc(doc(db, "clientes", tel), {
        nombre: nombre,
        telefono: tel,
        estadoSuscripcion: "ACTIVO",
        estadoUltimoEnvio: "PENDIENTE",
        fechaRegistro: serverTimestamp()
      }, { merge: true });

      status.innerHTML = `<span class="ok">✓ Registrado: ${nombre}</span>`;
      form.reset();
      document.getElementById("nombre").focus();
    } catch (err) {
      status.innerHTML = `<span class="err">❌ Error al guardar</span>`;
    } finally {
      btn.disabled = false;
    }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
  }
</script>

</body>
</html>
